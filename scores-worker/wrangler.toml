name = "oma-scores"
main = "src/index.ts"
compatibility_date = "2026-10-01"
workers_dev = false

# OMA: replace the placeholder with the user's own subdomain (the only place to change).
routes = [{ pattern = "scores.example.invalid", custom_domain = true }]

[observability]
enabled = false

[[d1_databases]]
binding = "DB"
database_name = "oma-scores"
# OMA: placeholder, put the id printed by `wrangler d1 create oma-scores`.
database_id = "00000000-0000-0000-0000-000000000000"
migrations_dir = "migrations"

[[ratelimits]]
name = "SUBMIT_LIMIT"
namespace_id = "1001"
simple = { limit = 5, period = 60 }

[triggers]
crons = ["17 3 * * *"]
