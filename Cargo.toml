[workspace]
resolver = "2"
members = ["crates/oma-core", "crates/oma-ipc", "crates/oma-win", "crates/oma-overlay", "crates/oma-load", "app/src-tauri"]

[workspace.package]
version = "0.5.0"
edition = "2021"
rust-version = "1.85"
license = "GPL-3.0-or-later"

[workspace.dependencies]
oma-core = { path = "crates/oma-core" }
oma-ipc = { path = "crates/oma-ipc" }
oma-win = { path = "crates/oma-win" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
rmp-serde = "1.3"
thiserror = "2.0"
tracing = "0.1"
