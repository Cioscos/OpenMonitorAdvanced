name = "oma-scores"
main = "src/index.ts"
compatibility_date = "2026-10-01"
workers_dev = false

# OMA: the leaderboard subdomain (the only place to change it).
routes = [{ pattern = "scores.cischi.dev", custom_domain = true }]

[observability]
enabled = false

[[d1_databases]]
binding = "DB"
database_name = "oma-scores"
# OMA: the id printed by `wrangler d1 create oma-scores --jurisdiction eu`.
database_id = "0160acfb-5880-4e82-a121-0dbf9a9cf31c"
migrations_dir = "migrations"

[[ratelimits]]
name = "SUBMIT_LIMIT"
namespace_id = "1001"
simple = { limit = 5, period = 60 }

[triggers]
crons = ["17 3 * * *"]
