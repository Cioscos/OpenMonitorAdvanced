name: Set up toolchain
description: Rust (from rust-toolchain.toml), pnpm, Node and the .NET SDK pinned by the repository.

runs:
  using: composite
  steps:
    # Installs the toolchain pinned in rust-toolchain.toml (channel and
    # components), instead of a floating `stable`.
    - name: Install Rust toolchain (from rust-toolchain.toml)
      shell: pwsh
      run: rustup show

    - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

    - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      with:
        version: 10

    - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      with:
        node-version: 22
        cache: pnpm
        cache-dependency-path: app/pnpm-lock.yaml

    # Installs the SDK pinned in global.json.
    - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
      with:
        global-json-file: global.json
