name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup-toolchain

      - name: Install UI dependencies
        working-directory: app
        run: pnpm install --frozen-lockfile

      # tauri::generate_context!() needs app/dist at compile time.
      - name: Build UI
        working-directory: app
        run: pnpm build

      - name: Rust format
        run: cargo fmt --all --check

      - name: Rust lint
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Rust tests
        run: cargo test --workspace

      - name: UI type check
        working-directory: app
        run: pnpm check

      - name: UI tests
        working-directory: app
        run: pnpm test

  service:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      # Installs the SDK pinned in global.json.
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Service tests
        run: dotnet test service/OpenMonitorAdvanced.slnx

  installer:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup-toolchain

      - name: Install UI dependencies
        working-directory: app
        run: pnpm install --frozen-lockfile

      # Publishes oma-service (with the trim-warning gate) and fetches the
      # pinned, signature-checked PawnIO setup into target/installer-payload.
      - name: Build installer payload
        shell: pwsh
        run: ./scripts/build-installer-payload.ps1

      - name: Build NSIS installer
        working-directory: app
        run: pnpm tauri build --bundles nsis

      - uses: actions/upload-artifact@v7
        with:
          name: installer
          path: target/release/bundle/nsis/*.exe
          if-no-files-found: error

  scripts:
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v7

      # The Integration tests build a PE fixture with Add-Type, which needs
      # the SDK pinned in global.json.
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Install Pester 5.7.1
        run: |
          if (-not (Get-Module -ListAvailable Pester | Where-Object Version -eq '5.7.1')) {
            try {
              Install-Module Pester -RequiredVersion 5.7.1 -Scope CurrentUser -Force -ErrorAction Stop
            } catch {
              if ($_.Exception.Message -notmatch 'publisher') { throw }
              Write-Warning "Publisher check failed, retrying with -SkipPublisherCheck: $($_.Exception.Message)"
              Install-Module Pester -RequiredVersion 5.7.1 -Scope CurrentUser -Force -SkipPublisherCheck -ErrorAction Stop
            }
          }
          if (-not (Get-Module -ListAvailable Pester | Where-Object { $_.Version -eq [version]'5.7.1' })) {
            throw 'Pester 5.7.1 is not installed'
          }

      - name: Script tests
        run: |
          Import-Module Pester -RequiredVersion 5.7.1
          Invoke-Pester -Path scripts/tests -ExcludeTagFilter Integration -CI

      # The runner is ephemeral and hosted by GitHub (RUNNER_ENVIRONMENT is
      # github-hosted), so the tests that modify the trust store may run.
      # Separate pwsh process from the unit tests above.
      - name: Script tests (Integration)
        run: |
          Import-Module Pester -RequiredVersion 5.7.1
          $config = New-PesterConfiguration
          $config.Run.Path = 'scripts/tests'
          $config.Run.PassThru = $true
          $config.Filter.Tag = 'Integration'
          $config.TestResult.Enabled = $true
          $result = Invoke-Pester -Configuration $config
          # Skipped tests must not look green: without elevation or the
          # isolated environment the Integration tests skip, leaving no real
          # crypto coverage.
          if ($result.Result -ne 'Passed' -or $result.PassedCount -eq 0 -or $result.SkippedCount -gt 0 -or $result.FailedCount -gt 0) {
            throw "Integration run not clean: result=$($result.Result) passed=$($result.PassedCount) skipped=$($result.SkippedCount) failed=$($result.FailedCount)"
          }

  actionlint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Pinned release and SHA-256 of the Linux amd64 tarball, from the
      # release's actionlint_1.7.12_checksums.txt. The Windows zip used for
      # local runs has a different hash: pin each archive separately
      # (windows_amd64.zip: 6e7241b51e6817ea6a047693d8e6fed13b31819c9a0dd6c5a726e1592d22f6e9).
      - name: Download actionlint
        env:
          ACTIONLINT_VERSION: 1.7.12
          ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
        run: |
          set -euo pipefail
          archive="actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          curl --fail --silent --show-error --location --output "$archive" \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/${archive}"
          echo "${ACTIONLINT_SHA256}  ${archive}" | sha256sum --check --strict
          tar -xzf "$archive" actionlint

      # actionlint checks workflows only: it does not look inside the steps
      # of a composite action. The next steps validate action.yml against the
      # GitHub Actions schema and check its steps explicitly. The real test of
      # the composite action is still the consumer jobs (checks, installer).
      - name: Lint workflows
        run: ./actionlint -color

      - name: Validate composite action schema
        run: |
          python3 -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/pip" install --quiet check-jsonschema==0.38.2 ruamel.yaml==0.19.1
          "$RUNNER_TEMP/venv/bin/check-jsonschema" --builtin-schema vendor.github-actions .github/actions/*/action.yml

      - name: Check composite action steps
        run: |
          "$RUNNER_TEMP/venv/bin/python" - <<'PY'
          import glob, os, re, sys
          from ruamel.yaml import YAML

          errors = []
          for path in sorted(glob.glob(".github/actions/*/action.yml")):
              doc = YAML(typ="safe").load(open(path, encoding="utf-8"))
              if doc["runs"]["using"] != "composite":
                  continue
              declared = set(doc.get("inputs") or {})
              for i, step in enumerate(doc["runs"]["steps"], 1):
                  where = f"{path} step {i}"
                  if "run" in step and step.get("shell") != "pwsh":
                      errors.append(f"{where}: run step must set shell: pwsh")
                  if "uses" in step:
                      ref = step["uses"]
                      if not ref.startswith("./") and not re.search(r"@[0-9a-f]{40}$", ref):
                          errors.append(f"{where}: {ref} is not pinned to a full SHA")
                  for field in ("working-directory",):
                      if field in step and not os.path.isdir(step[field]):
                          errors.append(f"{where}: {field} {step[field]} does not exist")
                  for key, value in (step.get("with") or {}).items():
                      if key.endswith(("-path", "-file")) and not os.path.exists(str(value)):
                          errors.append(f"{where}: with.{key} {value} does not exist")
                  for used in re.findall(r"inputs\.([\w-]+)", str(step)):
                      if used not in declared:
                          errors.append(f"{where}: undeclared input {used}")
          if errors:
              print(os.linesep.join(errors))
              sys.exit(1)
          print("composite action steps OK")
          PY
