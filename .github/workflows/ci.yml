name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      # Installs the toolchain pinned in rust-toolchain.toml (channel and
      # components), instead of a floating `stable`.
      - name: Install Rust toolchain (from rust-toolchain.toml)
        run: rustup show

      - uses: Swatinem/rust-cache@v2

      - uses: pnpm/action-setup@v6
        with:
          version: 10

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: app/pnpm-lock.yaml

      - name: Install UI dependencies
        working-directory: app
        run: pnpm install --frozen-lockfile

      # tauri::generate_context!() needs app/dist at compile time.
      - name: Build UI
        working-directory: app
        run: pnpm build

      - name: Rust format
        run: cargo fmt --all --check

      - name: Rust lint
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Rust tests
        run: cargo test --workspace

      - name: UI type check
        working-directory: app
        run: pnpm check

      - name: UI tests
        working-directory: app
        run: pnpm test

  service:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      # Installs the SDK pinned in global.json.
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Service tests
        run: dotnet test service/OpenMonitorAdvanced.slnx

  installer:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust toolchain (from rust-toolchain.toml)
        run: rustup show

      - uses: Swatinem/rust-cache@v2

      - uses: pnpm/action-setup@v6
        with:
          version: 10

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: app/pnpm-lock.yaml

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Install UI dependencies
        working-directory: app
        run: pnpm install --frozen-lockfile

      # Publishes oma-service (with the trim-warning gate) and fetches the
      # pinned, signature-checked PawnIO setup into target/installer-payload.
      - name: Build installer payload
        shell: pwsh
        run: ./scripts/build-installer-payload.ps1

      - name: Build NSIS installer
        working-directory: app
        run: pnpm tauri build --bundles nsis

      - uses: actions/upload-artifact@v7
        with:
          name: installer
          path: target/release/bundle/nsis/*.exe
          if-no-files-found: error
